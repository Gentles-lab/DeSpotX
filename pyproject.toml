[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "despotx"
version = "0.1.0"
description = "Spatial-aware ambient RNA decontamination for single-cell spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ruohan Wang" }]
keywords = ["spatial-transcriptomics", "decontamination", "graph-attention", "diffusion-model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.0",
    "torch_geometric>=2.5",
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
umap = ["scanpy>=1.10"]

[project.scripts]
despotx = "despotx.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/DeSpotX"
Repository = "https://github.com/your-org/DeSpotX"

[tool.setuptools.packages.find]
where = ["."]
include = ["despotx*"]
